[package]
name = "aiautocropper-url-tools"
version = "0.1.0"
edition = "2021"
description = "Offline URL builder for AI Auto Cropper scan-splitting workflows. Not an official SDK."
license = "MIT"
homepage = "https://aiautocropper.com/"
repository = "https://github.com/bbwdadfg/aiautocropper-url-tools"
readme = "README.md"
keywords = ["photo", "crop", "url-builder"]
include = ["src/**", "tests/**", "README.md", "LICENSE", "Cargo.toml"]

[lib]
name = "aiautocropper_url_tools"
path = "src/lib.rs"
